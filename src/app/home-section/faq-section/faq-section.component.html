<section id="faq" class="faq-section py-5">
  <div class="container faq-container">
    <div class="section-heading mb-4">
      <span class="eyebrow">GOOD TO KNOW</span>
      <h2 class="section-title mt-2">Frequently asked questions</h2>
    </div>
    <mat-accordion>
      @for (item of questions; track item[0]; let index = $index) {
        <mat-expansion-panel [expanded]="index === 0">
          <mat-expansion-panel-header>
            <mat-panel-title>{{ item[0] }}</mat-panel-title>
          </mat-expansion-panel-header>
          <p class="answer mb-0">{{ item[1] }}</p>
        </mat-expansion-panel>
      }
    </mat-accordion>
  </div>
</section>
