<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>ExpressDev</title>
  <style>
    .c{stroke-dasharray:100;stroke-dashoffset:100}
    .a{animation:draw .7s .1s ease-out forwards}
    .b{animation:draw .7s .45s ease-out forwards,nudge 3.2s 1.6s ease-in-out infinite}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes nudge{0%,70%,100%{transform:translateX(0)}82%{transform:translateX(4px)}}
    @media (prefers-reduced-motion:reduce){.c{animation:none;stroke-dashoffset:0}}
  </style>
  <path class="c a" pathLength="100" d="M9 9 24 24 9 39" stroke="#0B1220" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="c b" pathLength="100" d="M25 9 40 24 25 39" stroke="#0E7490" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
